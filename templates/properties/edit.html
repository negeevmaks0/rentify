{% extends "base.html" %}


{% block title %}
Edit Property
{% endblock %}


{% block content %}

<div class="row justify-content-center">

    <div class="col-md-8">

        <div class="card p-4">

            <h2 class="mb-4">
                Edit Property
            </h2>


            <form id="propertyForm">


                <div class="mb-3">

                    <label class="form-label">
                        Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        class="form-control"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Description
                    </label>

                    <textarea
                        id="description"
                        class="form-control"
                        rows="5"
                        required>
                    </textarea>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Location
                    </label>

                    <input
                        type="text"
                        id="location"
                        class="form-control"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Price per night
                    </label>

                    <input
                        type="number"
                        id="price"
                        class="form-control"
                        min="0"
                        step="0.01"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Room count
                    </label>

                    <input
                        type="number"
                        id="rooms"
                        class="form-control"
                        min="1"
                        required>

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Property type
                    </label>

                    <select
                        id="type"
                        class="form-select"
                        required>

                        <option value="apartment">
                            Apartment
                        </option>

                        <option value="house">
                            House
                        </option>

                        <option value="studio">
                            Studio
                        </option>

                    </select>

                </div>


                <div
                    id="error"
                    class="text-danger mb-3">
                </div>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Save changes

                </button>


                <a
                    href="/properties/cabinet/"
                    class="btn btn-secondary">

                    Cancel

                </a>


            </form>

        </div>

    </div>

</div>

{% endblock %}


{% block scripts %}

<script>

const propertyId =
    window.location.pathname
    .split("/")
    .filter(Boolean)
    .pop();


async function loadProperty(){

    const response = await fetch(

        `/api/properties/${propertyId}/`,

        {
            credentials: "include"
        }

    );


    if(!response.ok){

        window.location =
            "/properties/cabinet/";

        return;

    }


    const property =
        await response.json();


    document
        .getElementById("title")
        .value =
        property.title;


    document
        .getElementById("description")
        .value =
        property.description;


    document
        .getElementById("location")
        .value =
        property.location;


    document
        .getElementById("price")
        .value =
        property.price_per_night;


    document
        .getElementById("rooms")
        .value =
        property.room_count;


    document
        .getElementById("type")
        .value =
        property.property_type;

}


document
    .getElementById("propertyForm")
    .addEventListener(
        "submit",
        async function(e){

            e.preventDefault();


            const response =
                await fetch(

                    `/api/properties/${propertyId}/`,

                    {

                        method: "PATCH",

                        credentials: "include",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            title:
                                document
                                .getElementById("title")
                                .value,

                            description:
                                document
                                .getElementById("description")
                                .value,

                            location:
                                document
                                .getElementById("location")
                                .value,

                            price_per_night:
                                document
                                .getElementById("price")
                                .value,

                            room_count:
                                document
                                .getElementById("rooms")
                                .value,

                            property_type:
                                document
                                .getElementById("type")
                                .value

                        })

                    }

                );


            if(response.ok){

                window.location =
                    "/properties/cabinet/";

                return;

            }


            const data =
                await response.json();


            document
                .getElementById("error")
                .innerText =
                JSON.stringify(data);

        }

    );


loadProperty();

</script>

{% endblock %}

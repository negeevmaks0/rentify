{% extends "base.html" %}


{% block title %}
Properties
{% endblock %}


{% block content %}


<section class="properties-section">
    <div class="properties-header">
        <div class="properties-header-title">
            <h2>
                Available properties
            </h2>

            <p>
                Discover places available for your next stay.
            </p>

        </div>
    </div>

    <div class="property-search-wrapper">
        <div class="property-search">
            <span class="search-icon">
                🔍
            </span>

            <input
                type="text"
                id="propertySearch"
                placeholder="Search by title, location or description...">
        </div>
    </div>

    <div
        id="properties"
        class="row g-4">

        <div class="col-12 text-center">
            <p class="text-secondary">
                Loading properties...
            </p>
        </div>
    </div>

    <div
        id="emptyState"
        class="empty-state d-none">

        <h4>
            No properties found
        </h4>

        <p>
            Try changing your search.
        </p>
    </div>
</section>

<div
    id="propertyModal"
    class="property-modal">
    <div
        class="property-modal-content">
        <button
            id="closeModal"
            class="btn-close">
        </button>

        <div
            id="modalContent">
        </div>
    </div>
</div>

{% endblock %}


{% block scripts %}

<script src="/static/js/properties.js"></script>

{% endblock %}

{% extends "base.html" %}


{% block title %}
Create property
{% endblock %}


{% block content %}


<div class="property-create-page">
    <div class="property-create-card">
        <div class="property-create-header">
            <div class="property-create-icon">
                🏠
            </div>

            <h1>
                Create property
            </h1>

            <p>
                Add your property and start receiving bookings
            </p>
        </div>

        <form id="propertyForm">
            <div class="property-create-grid">
                <div class="property-create-fields">
                    <div class="create-field">
                        <label>
                            Title
                        </label>

                        <input
                            class="form-control"
                            id="title"
                            placeholder="Modern apartment"
                            required>
                    </div>

                    <div class="create-field">
                        <label>Description</label>

                        <textarea
                            class="form-control"
                            id="description"
                            rows="5"
                            placeholder="Describe your property..."></textarea>
                    </div>

                    <div class="create-field">
                        <label>
                            Location
                        </label>

                        <input
                            class="form-control"
                            id="location"
                            placeholder="Mainz, Germany"
                            required>
                    </div>

                    <div class="create-row">
                        <div class="create-field">
                            <label>
                                Price / night
                            </label>

                            <input
                                class="form-control"
                                id="price"
                                type="number"
                                step="0.01"
                                placeholder="69"
                                required>
                        </div>

                        <div class="create-field">

                            <label>
                                Rooms
                            </label>

                            <input
                                class="form-control"
                                id="rooms"
                                type="number"
                                placeholder="2"
                                required>
                        </div>
                    </div>

                    <div class="create-field">
                        <label>
                            Property type
                        </label>

                        <select
                            class="form-select"
                            id="type">

                            <option value="apartment">
                                Apartment
                            </option>

                            <option value="house">
                                House
                            </option>

                            <option value="studio">
                                Studio
                            </option>
                        </select>
                    </div>
                </div>

                <div class="property-upload-box">
                    <label class="upload-area">
                        <div class="upload-icon">
                            📷
                        </div>

                        <h4>
                            Upload images
                        </h4>

                        <p>
                            Select multiple photos
                        </p>

                        <input
                            type="file"
                            id="images"
                            multiple
                            class="form-control mb-3"
                            accept="image/*">


                        <div id="imagePreview"
                             class="mt-3">
                        </div>


                        <div id="uploadStatus"
                             class="mt-3">
                        </div>
                    </label>
                </div>
            </div>

            <button
                class="btn btn-primary create-property-button">
                Create property
            </button>
        </form>

        <div
            id="error"
            class="create-error">
        </div>
    </div>
</div>


{% endblock %}



{% block scripts %}

<script src="/static/js/property_create.js"></script>

{% endblock %}

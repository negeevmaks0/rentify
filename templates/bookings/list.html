{% extends "base.html" %}


{% block title %}
My bookings
{% endblock %}



{% block content %}


<h2>
My bookings
</h2>

<div class="mb-3">

<button 
class="btn btn-primary filter-btn"
data-filter="">
All
</button>


<button 
class="btn btn-success filter-btn"
data-filter="active">
Active
</button>


<button 
class="btn btn-secondary filter-btn"
data-filter="completed">
Completed
</button>


<button 
class="btn btn-danger filter-btn"
data-filter="cancelled">
Cancelled
</button>

<button class="filter-btn" data-filter="pending">
Pending
</button>

<button class="filter-btn" data-filter="approved">
Approved
</button>

<button class="filter-btn" data-filter="rejected">
Rejected
</button>

</div>


<div id="bookings">

Loading...

</div>



{% endblock %}



{% block scripts %}

<script src="/static/js/bookings_list.js"></script>

{% endblock %}

{% extends "base.html" %}

{% load static %}


{% block title %}
Register
{% endblock %}


{% block content %}

<section class="login-section">
<div class="login-card register-card">
    <div class="login-header">
        <div class="login-avatar">
            🏠
        </div>

        <h1>
            Create account.
        </h1>

        <p>
            Join Rentify and find your perfect place.
        </p>
    </div>

    <form id="registerForm">
        <div class="login-field">
            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                placeholder="Your username"
                autocomplete="username"
                required>

        </div>

        <div class="register-name-row">
            <div class="login-field">
                <label for="first_name">
                    First name
                </label>

                <input
                    type="text"
                    id="first_name"
                    placeholder="John"
                    autocomplete="given-name">
            </div>

            <div class="login-field">
                <label for="last_name">
                    Last name
                </label>

                <input
                    type="text"
                    id="last_name"
                    placeholder="Smith"
                    autocomplete="family-name">
            </div>
        </div>

        <div class="login-field">
            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="example@gmail.com"
                autocomplete="email"
                required>
        </div>

        <div class="login-field">
            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Create password"
                autocomplete="new-password"
                required>
        </div>

        <div class="login-field">
            <label for="role">
                Account type
            </label>

            <select
                id="role"
                class="login-select">

                <option value="tenant">
                    Tenant
                </option>

                <option value="landlord">
                    Landlord
                </option>
            </select>
        </div>

        <button
            type="submit"
            class="btn btn-primary login-button">
            Create account
        </button>
    </form>

    <div
        id="message"
        class="login-error">
    </div>

    <div class="login-footer">
        <span>
            Already have an account?
        </span>

        <a href="/login/">
            Login
        </a>

    </div>
</div>
</section>


{% endblock %}



{% block scripts %}

<script src="{% static 'js/register.js' %}"></script>

{% endblock %}

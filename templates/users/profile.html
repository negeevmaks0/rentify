{% extends "base.html" %}


{% block title %}
Profile
{% endblock %}


{% block content %}

<section class="profile-page">
    <div class="profile-card">
        <div class="profile-card-header">
            <div class="profile-avatar">
                <span id="avatarLetter">
                    ?
                </span>
            </div>

            <div>
                <h2 id="profileName">
                    My Profile
                </h2>

                <p id="profileUsername">
                    @username
                </p>
            </div>
        </div>

        <div class="profile-divider"></div>
        <form id="profileForm">
            <div class="profile-section-title">
                <h3>
                    Personal information
                </h3>

                <p>
                    Update the information connected to your account.
                </p>
            </div>

            <div class="row g-4">
                <div class="col-md-6">
                    <label
                        class="profile-label"
                        for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        readonly>
                </div>

                <div class="col-md-6">
                    <label
                        class="profile-label"
                        for="role">
                        Account type
                    </label>

                    <input
                        type="text"
                        id="role"
                        class="form-control"
                        readonly>
                </div>

                <div class="col-md-6">
                    <label
                        class="profile-label"
                        for="first_name">
                        First name
                    </label>

                    <input
                        type="text"
                        id="first_name"
                        class="form-control">
                </div>

                <div class="col-md-6">
                    <label
                        class="profile-label"
                        for="last_name">
                        Last name
                    </label>

                    <input
                        type="text"
                        id="last_name"
                        class="form-control">
                </div>

                <div class="col-12">
                    <label
                        class="profile-label"
                        for="email">
                        Email address
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control">
                </div>
            </div>

            <div class="profile-form-footer">
                <p
                    id="message"
                    class="profile-message">
                </p>

                <button
                    type="submit"
                    class="btn btn-primary">
                    Save changes
                </button>
            </div>
        </form>
    </div>
</section>

{% endblock %}


{% block scripts %}

<script src="/static/js/profile.js"></script>

{% endblock %}

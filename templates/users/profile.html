{% extends "base.html" %}


{% block title %}
Profile
{% endblock %}



{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6">

        <div class="card p-4">

            <h2 class="mb-4">
                My Profile
            </h2>


            <form id="profileForm">


                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        class="form-control"
                        readonly
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        First name
                    </label>

                    <input
                        type="text"
                        id="first_name"
                        class="form-control"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Last name
                    </label>

                    <input
                        type="text"
                        id="last_name"
                        class="form-control"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        class="form-control"
                    >

                </div>


                <div class="mb-3">

                    <label class="form-label">
                        Role
                    </label>

                    <input
                        type="text"
                        id="role"
                        class="form-control"
                        readonly
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary">

                    Save changes

                </button>


                <p
                    id="message"
                    class="mt-3">
                </p>


            </form>

        </div>

    </div>

</div>

{% endblock %}



{% block scripts %}

<script src="/static/js/profile.js"></script>

{% endblock %}

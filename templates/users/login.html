{% extends "base.html" %}

{% block title %}
Login
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-5">

        <div class="card p-4">

            <h2 class="mb-4 text-center">
                Login
            </h2>

            <form id="loginForm">

                <div class="mb-3">

                    <label class="form-label">
                        Username
                    </label>

                    <input
                        class="form-control"
                        id="username"
                        required>

                </div>

                <div class="mb-4">

                    <label class="form-label">
                        Password
                    </label>

                    <input
                        type="password"
                        class="form-control"
                        id="password"
                        required>

                </div>

                <button
                    class="btn btn-primary w-100">

                    Login

                </button>

            </form>

            <div
                id="error"
                class="text-danger mt-3">

            </div>

        </div>

    </div>

</div>

{% endblock %}

{% block scripts %}

<script src="/static/js/auth.js"></script>

{% endblock %}

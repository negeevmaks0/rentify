{% extends "base.html" %}

{% load static %}

{% block title %}
Login
{% endblock %}

{% block content %}

<section class="login-section">
<div class="login-card">
    <div class="login-header">
        <div class="login-avatar">
            🔐
        </div>

        <h1>
            Welcome back.
        </h1>

        <p>
            Sign in to continue to Rentify.
        </p>
    </div>

    <form id="loginForm">
        <div class="login-field">
            <label
                for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="example@gmail.com"
                required>
        </div>

        <div class="login-field">
            <label
                for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required>
        </div>

        <button
            type="submit"
            class="btn btn-primary login-button">
            Login
        </button>

    </form>

    <div
        id="error"
        class="login-error">
    </div>

    <div class="login-footer">
        <span>
            Don't have an account?
        </span>

        <a href="/register/">
            Create one
        </a>
    </div>
</div>
</section>

{% endblock %}

{% block scripts %}

<script src="{% static 'js/login.js' %}"></script>

{% endblock %}
